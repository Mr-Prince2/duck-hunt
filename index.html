<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Duck Hunt - Retro Arcade Edition</title>
        <link rel="stylesheet" href="duckhunt.css">
    </head>
    <body>
        <div id="flash-overlay"></div>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <div class="start-box">
                <h1 class="title">DUCK HUNT</h1>
                <p class="subtitle">RETRO ARCADE EDITION</p>
                <div class="start-prompt">CLICK TO PULL TRIGGER & START</div>
                <div class="top-score-display">TOP SCORE: <span id="start-top-score">000000</span></div>
            </div>
        </div>

        <!-- Banner Overlay for Fly Away / Round Announcements -->
        <div id="banner-overlay" class="banner hidden">
            <span id="banner-text">FLY AWAY</span>
        </div>

        <!-- Pause Screen Overlay -->
        <div id="pause-screen" class="overlay hidden">
            <div class="pause-box">
                <h2 class="pause-title">GAME PAUSED</h2>
                <p class="pause-subtitle">PRESS [ESC] TO RESUME</p>
            </div>
        </div>

        <!-- Main Game Area -->
        <div id="game-board">
            <!-- Ducks and Dog dynamic elements spawned here -->
        </div>

        <!-- NES Retro HUD Container -->
        <div id="hud">
            <div class="hud-section ammo-box">
                <div class="hud-label">SHOT</div>
                <div id="bullets-container">
                    <span class="bullet"></span>
                    <span class="bullet"></span>
                    <span class="bullet"></span>
                </div>
            </div>

            <div class="hud-section hit-box">
                <div id="duck-indicators">
                    <!-- 10 duck indicators generated dynamically or static -->
                    <span class="duck-indicator" data-index="0"></span>
                    <span class="duck-indicator" data-index="1"></span>
                    <span class="duck-indicator" data-index="2"></span>
                    <span class="duck-indicator" data-index="3"></span>
                    <span class="duck-indicator" data-index="4"></span>
                    <span class="duck-indicator" data-index="5"></span>
                    <span class="duck-indicator" data-index="6"></span>
                    <span class="duck-indicator" data-index="7"></span>
                    <span class="duck-indicator" data-index="8"></span>
                    <span class="duck-indicator" data-index="9"></span>
                </div>
                <div class="hud-label">HIT</div>
            </div>

            <div class="hud-section score-box">
                <div class="hud-label">SCORE</div>
                <div id="score">000000</div>
            </div>

            <div class="hud-section round-box">
                <div class="hud-label">ROUND</div>
                <div id="round-display">R=1</div>
            </div>

            <div class="hud-section top-score-box">
                <div class="hud-label">TOP SCORE</div>
                <div id="top-score">000000</div>
            </div>
        </div>

        <script src="duckhunt.js"></script>
    </body>
</html>
